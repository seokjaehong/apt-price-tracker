name: Daebang Hyundai 1 Tracker

on:
  workflow_dispatch:
  schedule:
    - cron: "7 0 * * *"   # 09:07 KST
    - cron: "7 10 * * *"  # 19:07 KST

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daebang-hyundai1-tracker
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Grant execute permission
        run: chmod +x ./gradlew

      - name: Collect Daebang Hyundai 1 listings
        env:
          BOT_ENABLED: "false"
          DAEBANG_ENABLED: "true"
          DAEBANG_TARGET_COMPLEX_NAME: "대방현대1차"
          DAEBANG_REGION_NAME: "서울동작_대방동"
          DAEBANG_CORTAR_NO: "1159010800"
          DAEBANG_OFF_MARKET_CONFIRM_MISS_COUNT: "3"
          NAVER_SAFE_MAX_COMPLEX_PAGES: "3"
          NAVER_SAFE_MAX_COMPLEX_PAGES_ON_OVERFLOW: "3"
          NAVER_SAFE_MAX_COMPLEXES_PER_REGION: "0"
          NAVER_SAFE_ROTATE_COMPLEXES_BY_DAY: "false"
          NAVER_SAFE_ARTICLE_ORDER: "prc,date"
        run: ./gradlew --no-daemon bootRun

      - name: Build dashboard
        run: python3 scripts/build_daebang_report.py

      - name: Commit snapshot and dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/apt-listings.json docs/index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update Daebang Hyundai listings [skip ci]"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
